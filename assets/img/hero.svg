<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract glowing skyline with wind turbines over San Joaquin County at night">
  <defs>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="160" r="220" fill="url(#glowCyan)"/>
  <circle cx="480" cy="120" r="200" fill="url(#glowViolet)"/>
  <circle cx="330" cy="420" r="240" fill="url(#glowGold)"/>

  <g fill="#EAF1F8" opacity="0.7">
    <circle cx="60" cy="70" r="1.6"/>
    <circle cx="120" cy="40" r="1.2"/>
    <circle cx="230" cy="90" r="1.8"/>
    <circle cx="340" cy="50" r="1.3"/>
    <circle cx="420" cy="100" r="1.6"/>
    <circle cx="500" cy="60" r="1.2"/>
    <circle cx="560" cy="130" r="1.8"/>
    <circle cx="90" cy="150" r="1.2"/>
    <circle cx="590" cy="70" r="1.4"/>
  </g>

  <path d="M0 380 C 100 340, 220 360, 320 330 S 520 350, 640 320 L640 560 L0 560 Z" fill="url(#hillGrad)"/>
  <path d="M0 420 C 140 390, 280 420, 400 395 S 540 410, 640 385 L640 560 L0 560 Z" fill="#0D1524" opacity="0.9"/>

  <g stroke="url(#lineGlow)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.95">
    <g transform="translate(120,330)">
      <line x1="0" y1="0" x2="0" y2="90"/>
      <g transform="rotate(20)"><line x1="0" y1="0" x2="0" y2="-50"/></g>
      <g transform="rotate(140)"><line x1="0" y1="0" x2="0" y2="-50"/></g>
      <g transform="rotate(260)"><line x1="0" y1="0" x2="0" y2="-50"/></g>
    </g>
    <g transform="translate(340,300)">
      <line x1="0" y1="0" x2="0" y2="100"/>
      <g transform="rotate(-15)"><line x1="0" y1="0" x2="0" y2="-56"/></g>
      <g transform="rotate(105)"><line x1="0" y1="0" x2="0" y2="-56"/></g>
      <g transform="rotate(225)"><line x1="0" y1="0" x2="0" y2="-56"/></g>
    </g>
    <g transform="translate(530,320)">
      <line x1="0" y1="0" x2="0" y2="85"/>
      <g transform="rotate(60)"><line x1="0" y1="0" x2="0" y2="-48"/></g>
      <g transform="rotate(180)"><line x1="0" y1="0" x2="0" y2="-48"/></g>
      <g transform="rotate(300)"><line x1="0" y1="0" x2="0" y2="-48"/></g>
    </g>
  </g>

  <circle cx="120" cy="330" r="4" fill="#22D3EE"/>
  <circle cx="340" cy="300" r="4" fill="#FBBF24"/>
  <circle cx="530" cy="320" r="4" fill="#22D3EE"/>

  <text x="36" y="530" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#EAF1F8" opacity="0.14">209</text>
</svg>

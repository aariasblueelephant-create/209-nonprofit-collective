<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of rolling hills with wind turbines under a sunrise, representing San Joaquin County">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d998"/>
      <stop offset="45%" stop-color="#e9a45c"/>
      <stop offset="100%" stop-color="#c86b4a"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f6247"/>
      <stop offset="100%" stop-color="#2d4a34"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c8a63"/>
      <stop offset="100%" stop-color="#456b4c"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ba672"/>
      <stop offset="100%" stop-color="#5c8a63"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="url(#sky)"/>

  <circle cx="460" cy="150" r="70" fill="#fbe9b8" opacity="0.9"/>
  <circle cx="460" cy="150" r="46" fill="#fdf3d2"/>

  <!-- river -->
  <path d="M0 330 C 120 300, 180 360, 300 330 S 480 300, 600 340 L600 500 L0 500 Z" fill="#7fa8c9" opacity="0.55"/>

  <!-- far hill -->
  <path d="M0 300 C 100 260, 220 280, 320 250 S 520 260, 600 240 L600 500 L0 500 Z" fill="url(#hillFar)"/>

  <!-- turbines on far hill -->
  <g stroke="#f4ead0" stroke-width="3" fill="none" stroke-linecap="round">
    <g transform="translate(150,255)">
      <line x1="0" y1="0" x2="0" y2="60"/>
      <g transform="rotate(15)"><line x1="0" y1="0" x2="0" y2="-34"/></g>
      <g transform="rotate(135)"><line x1="0" y1="0" x2="0" y2="-34"/></g>
      <g transform="rotate(255)"><line x1="0" y1="0" x2="0" y2="-34"/></g>
    </g>
    <g transform="translate(430,250)">
      <line x1="0" y1="0" x2="0" y2="55"/>
      <g transform="rotate(60)"><line x1="0" y1="0" x2="0" y2="-30"/></g>
      <g transform="rotate(180)"><line x1="0" y1="0" x2="0" y2="-30"/></g>
      <g transform="rotate(300)"><line x1="0" y1="0" x2="0" y2="-30"/></g>
    </g>
  </g>

  <!-- mid hill -->
  <path d="M0 360 C 140 320, 260 350, 380 320 S 520 330, 600 310 L600 500 L0 500 Z" fill="url(#hillMid)"/>

  <!-- turbines on mid hill -->
  <g stroke="#faf6ef" stroke-width="4" fill="none" stroke-linecap="round">
    <g transform="translate(90,335)">
      <line x1="0" y1="0" x2="0" y2="80"/>
      <g transform="rotate(30)"><line x1="0" y1="0" x2="0" y2="-44"/></g>
      <g transform="rotate(150)"><line x1="0" y1="0" x2="0" y2="-44"/></g>
      <g transform="rotate(270)"><line x1="0" y1="0" x2="0" y2="-44"/></g>
    </g>
    <g transform="translate(330,320)">
      <line x1="0" y1="0" x2="0" y2="75"/>
      <g transform="rotate(-10)"><line x1="0" y1="0" x2="0" y2="-40"/></g>
      <g transform="rotate(110)"><line x1="0" y1="0" x2="0" y2="-40"/></g>
      <g transform="rotate(230)"><line x1="0" y1="0" x2="0" y2="-40"/></g>
    </g>
    <g transform="translate(540,305)">
      <line x1="0" y1="0" x2="0" y2="70"/>
      <g transform="rotate(45)"><line x1="0" y1="0" x2="0" y2="-38"/></g>
      <g transform="rotate(165)"><line x1="0" y1="0" x2="0" y2="-38"/></g>
      <g transform="rotate(285)"><line x1="0" y1="0" x2="0" y2="-38"/></g>
    </g>
  </g>

  <!-- near hill -->
  <path d="M0 420 C 160 390, 280 430, 400 400 S 520 410, 600 390 L600 500 L0 500 Z" fill="url(#hillNear)"/>

  <!-- 209 mark -->
  <text x="40" y="470" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#faf6ef" opacity="0.85">209</text>
</svg>
